<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Viewport ajustada com viewport-fit=cover para respeitar as bordas da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configurações para forçar tela cheia no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Vincula o arquivo de configuração PWA -->
    <link rel="manifest" href="manifest.json">
    
    <title>Aplicativo de Atendimento</title>
    
    <style>
        /* Usa dynamic viewport height (dvh) para adaptar a altura real sem a barra do navegador */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* O container adiciona margem inferior dinâmica (safe-area) + 16px de folga extra */
        #app-chat-container {
            width: 100%;
            height: calc(100% - env(safe-area-inset-bottom, 0px) - 16px);
            box-sizing: border-box;
            padding-bottom: 5px;
        }

        /* Esconde a marca d'água em fallbacks externos */
        [data-testid="brand-footer"],
        footer[class*="Brand"],
        div[class*="BrandFooter"] {
            display: none !important;
        }
    </style>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
        window.zEMessenger = { autorender: false };
    </script>
</head>
<body>
    
    <!-- Área onde o widget é embutido -->
    <div id="app-chat-container"></div>

    <!-- Script do Zendesk -->
    <script id="ze-snippet" src="https://static.zdassets.com/ekr/snippet.js?key=362d9aa2-a80d-4436-a486-0d874355c805"></script>

    <script>
        window.addEventListener('load', function() {
            // Renderiza o widget no container
            zE('messenger', 'render', { 
                mode: 'embedded', 
                widget: { 
                    targetElement: '#app-chat-container' 
                } 
            });

            // Injeta regra dentro do Shadow DOM do Zendesk para remover a marca d'água
            zE('messenger:on', 'open', function() {
                setTimeout(function() {
                    const host = document.querySelector('#app-chat-container iframe');
                    if (host && host.contentDocument) {
                        const style = document.createElement('style');
                        style.innerHTML = '[data-testid="brand-footer"], footer, .sc-brand-footer { display: none !important; }';
                        host.contentDocument.head.appendChild(style);
                    }
                }, 500);
            });
        });
    </script>

</body>
</html>
